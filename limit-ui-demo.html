<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Regularhood · Customer limit demo</title>
<!-- The app's real styles, so the demo looks exactly like the shop app. Only the new parts are styled below. -->
<link rel="stylesheet" href="web/src/styles.css" />
<link rel="stylesheet" href="web/src/counter.css" />
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>
  /* ---------- demo controls (not part of the app) ---------- */
  .demo-bar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px;
    padding: 10px 16px; background: #1e1b4b; color: #e0e7ff; font-size: 13px;
  }
  .demo-bar b { color: #fff; }
  .demo-bar label { display: flex; align-items: center; gap: 8px; color: #e0e7ff; }
  .demo-bar input[type=range] { width: 140px; accent-color: #a5b4fc; }
  .demo-bar .seg { display: inline-flex; border: 1px solid #4338ca; border-radius: 999px; overflow: hidden; }
  .demo-bar .seg button { border: 0; padding: 5px 11px; background: none; color: #c7d2fe; font: inherit; cursor: pointer; }
  .demo-bar .seg button.on { background: #6366f1; color: #fff; }
  .demo-bar .n { min-width: 22px; font-weight: 700; color: #fff; font-variant-numeric: tabular-nums; }
  .logo img { width: 34px; height: 34px; display: block; border-radius: 9px; }

  /* One look for every "limit" thing: grey while there's room, amber from 40, red when full. Tapping any opens the plan. */
  .limit-bar { height: 4px; overflow: hidden; border-radius: 999px; background: var(--surface-3); }
  .limit-bar span { display: block; height: 100%; border-radius: inherit; background: var(--brand-fill); transition: width .4s ease; }
  .is-warn .limit-bar span { background: #d97706; }
  .is-full .limit-bar span { background: var(--bad); }
  .limit-open { cursor: pointer; font: inherit; text-align: left; }

  /* phone topbar */
  .limit-pill {
    display: grid; gap: 4px; min-width: 58px; margin-right: 6px; padding: 6px 10px;
    border: 1px solid var(--line-strong); border-radius: 12px; background: var(--surface);
    color: var(--ink-2); font-size: 13px; font-weight: 800; line-height: 1; text-align: center;
    font-variant-numeric: tabular-nums;
  }
  .limit-pill.is-warn { border-color: #f3c46b; background: var(--gold-soft); color: var(--gold); }
  .limit-pill.is-full { border-color: color-mix(in srgb, var(--bad) 40%, transparent); background: var(--bad-soft); color: var(--bad); }
  .founding-pill { display: inline-flex; align-items: center; gap: 5px; margin-right: 6px; padding: 7px 10px; border-radius: 12px; background: var(--gold-soft); color: var(--gold); font-size: 12px; font-weight: 800; }

  /* desktop sidebar */
  .limit-card {
    display: grid; gap: 8px; width: 100%; margin: 14px 0 4px; padding: 12px;
    border: 1px solid var(--line); border-radius: 13px; background: var(--surface-2); color: var(--ink-2); font-size: 13px;
  }
  .limit-card-top { display: flex; justify-content: space-between; align-items: baseline; }
  .limit-card-top b { color: var(--ink); font-size: 15px; font-variant-numeric: tabular-nums; }
  .limit-card .limit-bar { height: 6px; }
  .limit-card .go { color: var(--brand-ink); font-weight: 700; }
  .limit-card.is-warn { background: var(--gold-soft); border-color: #f3c46b; }
  .limit-card.is-full { background: var(--bad-soft); border-color: color-mix(in srgb, var(--bad) 35%, transparent); }
  .limit-card.is-full .go { color: var(--bad); }

  /* one-line strip: counter (45+) and customers page */
  .limit-strip {
    display: flex; align-items: center; gap: 10px; width: 100%; padding: 11px 14px;
    border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface);
    color: var(--ink-2); font-size: 14px; font-weight: 600;
  }
  .limit-strip > span:first-of-type { flex: 1; }
  .limit-strip .go { display: inline-flex; align-items: center; gap: 2px; color: var(--brand-ink); font-weight: 700; white-space: nowrap; }
  .limit-strip.is-warn { border-color: #f3c46b; background: var(--gold-soft); color: var(--gold); }
  .limit-strip.is-full { border-color: color-mix(in srgb, var(--bad) 35%, transparent); background: var(--bad-soft); color: var(--bad); }
  .limit-strip.is-full .go { color: var(--bad); }
  .limit-strip svg { width: 18px; height: 18px; }
  .strip-wrap { display: grid; gap: 8px; }
  .strip-wrap .limit-bar { height: 6px; }
  .result-limit { color: var(--gold); font-size: 13px; font-weight: 700; background: none; border: 0; padding: 0; text-decoration: underline; text-underline-offset: 3px; }

  /* ---------- the plan modal ---------- */
  .plan-sheet { gap: 14px; }
  .plan-sheet-hero { display: grid; justify-items: center; gap: 6px; text-align: center; }
  .plan-sheet-hero .plan-crown { width: 52px; height: 52px; }
  .plan-sheet-hero h2 { font-size: 22px; }
  .plan-sheet-hero p { color: var(--muted); font-size: 14px; }
  .plan-sheet-perks { display: grid; gap: 8px; margin: 0; padding: 12px 14px; list-style: none; border-radius: 14px; background: var(--surface-2); }
  .plan-sheet-perks li { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 14.5px; }
  .plan-sheet-perks svg { width: 18px; height: 18px; color: var(--brand-ink); flex: none; }
  .plan-sheet .plan-option-note { display: none; } /* keep the choice to name + price */
  .plan-sheet-foot { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 14px; color: var(--muted); font-size: 12.5px; }
  .plan-sheet-foot span { display: inline-flex; align-items: center; gap: 4px; }
  .plan-sheet-foot svg { width: 14px; height: 14px; }
  .plan-sheet .seats { text-align: center; color: var(--gold); font-size: 13px; font-weight: 700; }
  .plan-sheet .more { justify-self: center; color: var(--muted); font-size: 13px; text-decoration: underline; }
  .sheet-close { position: absolute; top: 12px; right: 12px; }
  .plan-sheet { position: relative; }
</style>
</head>
<body>

<div class="demo-bar">
  <b>DEMO</b>
  <label>Customers <input id="count" type="range" min="0" max="50" value="23" /> <span class="n" id="countN">23</span>/50</label>
  <span class="seg" id="plan"><button data-v="free" class="on">Free</button><button data-v="founding">Founding</button></span>
  <span class="seg" id="screen"><button data-v="counter" class="on">Add visit</button><button data-v="result">After visit</button><button data-v="customers">Customers</button></span>
  <span style="opacity:.8">Limit pe kahin bhi tap karo → plan khulega</span>
</div>

<div class="app">
  <aside class="sidebar">
    <a href="#" class="brand"><span class="logo"><img src="web/public/brand/regularhood-logo.svg" alt="" /></span> <span>Sharma General Store</span></a>
    <a href="#" class="side-link" data-nav="counter"><i data-lucide="stamp"></i> Add visit</a>
    <a href="#" class="side-link" data-nav="customers"><i data-lucide="users"></i> Customers</a>
    <a href="#" class="side-link"><i data-lucide="settings"></i> Settings</a>
    <div id="sideLimit"></div>
    <div class="side-foot">
      <div class="lang-toggle"><button class="active">EN</button><button>हिं</button><button>മ</button></div>
      <button class="side-link"><i data-lucide="download"></i> Install app</button>
      <button class="side-link"><i data-lucide="log-out"></i> Log out</button>
    </div>
  </aside>

  <header class="topbar">
    <a href="#" class="brand"><span class="logo"><img src="web/public/brand/regularhood-logo.svg" alt="" /></span> <span>Sharma General Store</span></a>
    <span id="topLimit"></span>
    <div class="lang-toggle"><button class="active">EN</button><button>हिं</button><button>മ</button></div>
  </header>

  <main class="page" id="page"></main>

  <nav class="bottom-nav nav-3" aria-label="Main">
    <a href="#" data-nav="counter"><i data-lucide="stamp"></i> Add visit</a>
    <a href="#" data-nav="customers"><i data-lucide="users"></i> Customers</a>
    <a href="#"><i data-lucide="settings"></i> Settings</a>
  </nav>
</div>

<div id="modal"></div>

<script>
  const LIMIT = 50, NEEDED = 5, REWARD = 'Free gift', SEATS_LEFT = 63, SEATS = 100;
  const PRICES = { lifetime: 1499, yearly: 499 };
  const state = { count: 23, plan: 'free', screen: 'counter', open: false, kind: 'lifetime' };

  const free = () => state.plan === 'free';
  const left = () => Math.max(0, LIMIT - state.count);
  const level = () => state.count >= LIMIT ? 'is-full' : state.count >= 40 ? 'is-warn' : '';
  const bar = () => `<div class="limit-bar"><span style="width:${Math.min(100, state.count / LIMIT * 100)}%"></span></div>`;
  const rupees = (n) => '₹' + n.toLocaleString('en-IN');

  function topPill() {
    if (!free()) return `<span class="founding-pill"><i data-lucide="crown" style="width:14px;height:14px"></i> Founding</span>`;
    return `<button class="limit-pill limit-open ${level()}" aria-label="${state.count} of ${LIMIT} free customers. See plans">${state.count}/${LIMIT}${bar()}</button>`;
  }

  function sideCard() {
    if (!free()) return '';
    return `<button class="limit-card limit-open ${level()}">
      <span class="limit-card-top"><span>Free plan</span><b>${state.count}/${LIMIT}</b></span>
      ${bar()}
      <span class="go">${state.count >= LIMIT ? 'Full · Get unlimited →' : 'Get unlimited →'}</span></button>`;
  }

  // Only near the end: on the counter the shop should be adding visits, not reading.
  function counterStrip() {
    if (!free() || state.count < 45) return '';
    return `<button class="limit-strip limit-open ${level()}"><i data-lucide="${state.count >= LIMIT ? 'lock' : 'users'}"></i>
      <span>${state.count >= LIMIT ? 'Free plan full: no new customers' : `Only ${left()} new customers left`}</span>
      <span class="go">Get unlimited <i data-lucide="chevron-right"></i></span></button>`;
  }

  function counter() {
    return `<div class="counter">
      <p class="counter-rule">Every ${NEEDED} visits → <b>${REWARD}</b></p>
      ${counterStrip()}
      <div class="phone-display empty">Customer’s phone number</div>
      <div class="suggestions">
        <button class="suggestion"><strong>98765 43210</strong><span>3/${NEEDED}</span></button>
        <button class="suggestion"><strong>91234 56780</strong><span>🎁 reward due</span></button>
      </div>
      <div class="keypad">
        ${[1,2,3,4,5,6,7,8,9].map(k => `<button>${k}</button>`).join('')}
        <button class="key-soft">Clear</button><button>0</button><button class="key-soft"><i data-lucide="delete"></i></button>
      </div>
      <button class="btn btn-primary btn-xl add-visit" disabled><i data-lucide="check"></i> Add visit</button>
      <p class="counter-today">Today: <b>12</b> visits · <b>2</b> rewards given</p>
    </div>`;
  }

  function stamps(on) {
    let s = '';
    for (let i = 0; i < NEEDED; i++) {
      const last = i === NEEDED - 1;
      s += `<span class="stamp ${i < on ? 'on' : ''} ${last ? 'last' : ''}">${last ? '<i data-lucide="gift"></i>' : i < on ? '<i data-lucide="check"></i>' : ''}</span>`;
    }
    return `<div class="stamps stamps-lg">${s}</div>`;
  }

  function result() {
    // One quiet line, and only once the shop is close to the limit.
    const line = free() && state.count >= 40
      ? `<button class="result-limit limit-open">${state.count >= LIMIT ? 'That was your last free customer' : `${left()} free customers left`}</button>` : '';
    return `<div class="counter"><section class="result">
      <span class="result-icon"><i data-lucide="check" style="width:48px;height:48px"></i></span>
      <p class="result-phone">99887 76655</p>
      <h1>Visit 1 of ${NEEDED}</h1>
      <p>New customer! ${NEEDED - 1} more for ${REWARD}.</p>
      ${stamps(1)}
      ${line}
      <a class="btn btn-whatsapp btn-lg" href="#"><i data-lucide="message-circle"></i> Send card on WhatsApp</a>
      <button class="btn btn-primary btn-xl">Next customer <span class="countdown">8</span></button>
      <button class="link"><i data-lucide="undo-2" style="width:14px;height:14px"></i> Wrong number? Undo</button>
    </section></div>`;
  }

  function customers() {
    const phones = ['98765 43210','91234 56780','99887 76655','90000 11122','88776 65544','97531 86420'];
    const rows = phones.slice(0, Math.max(1, Math.min(6, state.count))).map((p, i) =>
      `<li><a class="row-item" href="#"><span class="row-main"><strong class="tabular">${p}${i === 1 ? '<span class="muted"> · Ramesh</span>' : ''}</strong><span>Last visit ${i + 1} days ago</span></span>
       <span class="row-end">${i === 1 ? '<span class="reward-pill">🎁 Reward</span>' : `<span class="stamp-count">${(i * 2) % NEEDED}/${NEEDED}</span>`}</span></a></li>`).join('');
    const strip = free() ? `<button class="limit-strip limit-open strip-wrap ${level()}" style="display:grid">
        <span style="display:flex;align-items:center;gap:10px"><span style="flex:1"><b>${state.count}/${LIMIT}</b> free customers · ${state.count >= LIMIT ? 'full' : left() + ' left'}</span>
        <span class="go">Get unlimited <i data-lucide="chevron-right"></i></span></span>${bar()}</button>` : '';
    return `<header class="page-head"><div><h1>Customers</h1><p>${state.count} customers</p></div></header>
      ${strip}
      <div class="chips"><a class="chip active">All</a><a class="chip"><i data-lucide="gift" style="width:14px;height:14px"></i> Reward waiting</a><a class="chip"><i data-lucide="user-x" style="width:14px;height:14px"></i> Not seen 30 days</a></div>
      <section class="card"><div class="input-icon"><i data-lucide="search"></i><input placeholder="Search phone number" /></div><ul class="rows">${rows}</ul></section>`;
  }

  // The plan, short enough to decide in one look: what you get, two prices, one button.
  function modal() {
    if (!state.open) return '';
    const head = state.count >= LIMIT
      ? 'Your 50 free spots are full. Get unlimited to add new customers.'
      : `You’ve used ${state.count} of ${LIMIT} free customers.`;
    const option = (k) => `<button type="button" role="radio" aria-checked="${state.kind === k}" data-kind="${k}" class="plan-option ${state.kind === k ? 'selected' : ''}">
        <span class="plan-radio" aria-hidden></span>
        <span class="plan-option-main"><span class="plan-option-name">${k === 'lifetime' ? '<i data-lucide="infinity" style="width:16px;height:16px"></i> Lifetime' : 'Yearly'}</span></span>
        <span class="plan-option-price"><strong>${rupees(PRICES[k])}</strong><span>${k === 'lifetime' ? 'once' : '/ year'}</span></span>
        ${k === 'lifetime' ? '<span class="plan-best">Best value</span>' : ''}
      </button>`;
    return `<div class="overlay" data-close>
      <div class="sheet plan-sheet" role="dialog" aria-modal="true" aria-label="Founding Shop">
        <span class="sheet-grip"></span>
        <button class="icon-btn sheet-close" data-close aria-label="Close"><i data-lucide="x"></i></button>
        <div class="plan-sheet-hero">
          <span class="plan-crown"><i data-lucide="crown"></i></span>
          <h2>Founding Shop</h2>
          <p>${head}</p>
        </div>
        <ul class="plan-sheet-perks">
          <li><i data-lucide="users"></i> Unlimited customers</li>
          <li><i data-lucide="message-circle"></i> WhatsApp cards sent automatically</li>
          <li><i data-lucide="star"></i> More Google reviews</li>
        </ul>
        <div class="plan-options" role="radiogroup" aria-label="Choose how to pay">${option('lifetime')}${option('yearly')}</div>
        <p class="seats">Only ${SEATS_LEFT} of ${SEATS} Founding places left</p>
        <button class="btn btn-primary btn-xl plan-pay">Pay ${rupees(PRICES[state.kind])} with UPI</button>
        <div class="plan-sheet-foot">
          <span><i data-lucide="rotate-ccw"></i> 7-day full refund</span>
          <span><i data-lucide="check"></i> No auto-debit</span>
        </div>
        <a class="more" href="#">See full plan details</a>
      </div>
    </div>`;
  }

  function render() {
    document.getElementById('countN').textContent = state.count;
    document.getElementById('topLimit').innerHTML = topPill();
    document.getElementById('sideLimit').innerHTML = sideCard();
    document.getElementById('page').innerHTML = state.screen === 'customers' ? customers() : state.screen === 'result' ? result() : counter();
    document.getElementById('modal').innerHTML = modal();
    document.body.style.overflow = state.open ? 'hidden' : '';
    const nav = state.screen === 'customers' ? 'customers' : 'counter';
    document.querySelectorAll('.side-link[data-nav], .bottom-nav a[data-nav]').forEach(a => a.classList.toggle('active', a.dataset.nav === nav));
    lucide.createIcons();
  }

  document.getElementById('count').addEventListener('input', e => { state.count = +e.target.value; render(); });
  for (const id of ['plan', 'screen']) {
    document.getElementById(id).addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      state[id] = b.dataset.v;
      document.querySelectorAll(`#${id} button`).forEach(x => x.classList.toggle('on', x === b));
      render();
    });
  }
  document.addEventListener('click', e => {
    const nav = e.target.closest('[data-nav]');
    if (nav) { e.preventDefault(); document.querySelector(`#screen button[data-v="${nav.dataset.nav}"]`).click(); return; }
    if (e.target.closest('.limit-open')) { state.open = true; render(); return; }
    const kind = e.target.closest('[data-kind]');
    if (kind) { state.kind = kind.dataset.kind; render(); return; }
    // Close on the X, or a tap on the dark area outside the sheet.
    const close = e.target.closest('[data-close]');
    if (close && (close.classList.contains('sheet-close') || e.target === close)) { state.open = false; render(); return; }
    if (e.target.closest('a[href="#"]')) e.preventDefault();
  });
  addEventListener('keydown', e => { if (e.key === 'Escape' && state.open) { state.open = false; render(); } });
  render();
</script>
</body>
</html>
