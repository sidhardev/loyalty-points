<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Regularhood — Simple loyalty stamp card for local shops</title>
    <meta name="description" content="Free loyalty stamp card for chai stalls, cafés, salons, bakeries and kirana stores. Type the customer’s phone number, tap Add visit, and the app tells you when to give the reward. No app, no QR codes, no points." />
    <!-- Link previews (WhatsApp, Facebook, LinkedIn, X) for every page; the homepage's canonical URL and structured data are added by scripts/prerender.mjs. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Regularhood" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:title" content="Regularhood — turn walk-ins into regulars" />
    <meta property="og:description" content="Every 5th visit free: a stamp card on the customer’s phone number. One button at the counter, the card on WhatsApp. Free to start." />
    <meta property="og:image" content="https://www.regularhood.in/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Regularhood — a shopfront drawn from QR modules. Turn walk-ins into regulars: points on every bill with one QR scan." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Regularhood — turn walk-ins into regulars" />
    <meta name="twitter:description" content="Every 5th visit free: a stamp card on the customer’s phone number. One button at the counter, the card on WhatsApp. Free to start." />
    <meta name="twitter:image" content="https://www.regularhood.in/og.png" />
    <meta name="application-name" content="Regularhood" />
    <meta name="theme-color" content="#f4f8f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a110e" media="(prefers-color-scheme: dark)" />
    <!-- use-credentials: send cookies with the manifest request too (tunnels like ngrok need theirs, or they answer with a warning page) -->
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Regularhood" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&display=swap" rel="stylesheet" />
    <script>
      // Apply the saved (or system) colour theme before the page paints.
      try {
        var t = localStorage.getItem('lp_theme');
        document.documentElement.dataset.theme = t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
