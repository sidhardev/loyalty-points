<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Habiturn — Loyalty points &amp; rewards app for local shops</title>
    <meta name="description" content="Free loyalty program for chai stalls, cafés, salons, bakeries and kirana stores. Give points on every bill with a QR scan, show rewards on the customer’s phone, and bring regulars back with WhatsApp reminders. No app for customers to install." />
    <!-- Link previews (WhatsApp, Facebook, LinkedIn, X) for every page; the homepage's canonical URL and structured data are added by scripts/prerender.mjs. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Habiturn" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:title" content="Habiturn — turn walk-ins into regulars" />
    <meta property="og:description" content="Points on every bill, rewards your customers see on their phone, and a nudge when they haven’t been back. Free to start." />
    <meta property="og:image" content="https://habiturn.sidhar.me/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Habiturn — a shopfront drawn from QR modules. Turn walk-ins into regulars: points on every bill with one QR scan." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Habiturn — turn walk-ins into regulars" />
    <meta name="twitter:description" content="Points on every bill, rewards your customers see on their phone, and a nudge when they haven’t been back. Free to start." />
    <meta name="twitter:image" content="https://habiturn.sidhar.me/og.png" />
    <meta name="application-name" content="Habiturn" />
    <meta name="theme-color" content="#f4f8f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a110e" media="(prefers-color-scheme: dark)" />
    <!-- use-credentials: send cookies with the manifest request too (tunnels like ngrok need theirs, or they answer with a warning page) -->
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Habiturn" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&display=swap" rel="stylesheet" />
    <script>
      // Apply the saved (or system) colour theme before the page paints.
      try {
        var t = localStorage.getItem('lp_theme');
        document.documentElement.dataset.theme = t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
